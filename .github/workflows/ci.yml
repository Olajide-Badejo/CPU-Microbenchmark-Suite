name: ci

# Build, test, style, and the AArch64 NEON self test under qemu on x86 runners.
# No performance numbers are produced here: cloud runners have no stable clock
# control or PMU, so any timing would be misleading (Section 15). The report is
# compiled from the committed canonical summary.json, not from a fresh run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build and analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ python3 python3-pip \
            g++-aarch64-linux-gnu qemu-user
          python3 -m pip install --quiet --break-system-packages \
            numpy scipy matplotlib tqdm ruff

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Unit and integration tests
        run: cd build && ctest --output-on-failure

      - name: Style gates (dash check and ruff)
        run: |
          python3 scripts/check_no_dashes.py
          ruff check scripts

      - name: AArch64 NEON self test under qemu
        run: bash scripts/arm_selftest.sh

  report:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX and Python plotting
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended texlive-science \
            lmodern python3-pip
          python3 -m pip install --quiet --break-system-packages \
            numpy scipy matplotlib tqdm

      - name: Regenerate assets from committed summary and build reports
        run: |
          python3 scripts/gen_report_assets.py experiments/results/summary.json
          make report
          make report-debug
          python3 scripts/check_no_dashes.py

      - name: Upload report PDFs
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            report/build/main.pdf
            report_debug/build/debug_report.pdf
          if-no-files-found: warn
